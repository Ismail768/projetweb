<form action="#" method="post">
    <label for="nom">Nom de l'activité</label>
    <input type="text" id="nom" name="nom" required minlength="3" maxlength="50"
           pattern="[A-Za-zÀ-ÿ0-9 ]{3,50}">

    <label for="categorie">Catégorie</label>
    <select id="categorie" name="categorie" required>
        <option value="">-- Choisir --</option>
        <option value="sport-collectif">Sport collectif</option>
        <option value="sport-individuel">Sport individuel</option>
        <option value="natation">Natation</option>
    </select>

    <label for="description">Description</label>
    <textarea id="description" name="description" required maxlength="300"></textarea>

    <label for="jour">Jour</label>
    <select id="jour" name="jour" required>
        <option value="">-- Choisir --</option>
        <option>Lundi</option><option>Mardi</option><option>Mercredi</option>
        <option>Jeudi</option><option>Vendredi</option><option>Samedi</option>
        <option>Dimanche</option>
    </select>

    <label for="horaire">Horaire</label>
    <input type="text" id="horaire" name="horaire" required
           pattern="([01][0-9]|2[0-3]):[0-5][0-9] - ([01][0-9]|2[0-3]):[0-5][0-9]"
           placeholder="08:30 - 10:00">

    <label for="tarif">Tarif (dt)</label>
    <input type="number" id="tarif" name="tarif" required min="0" max="1000" step="0.01">

    <label for="places">Nombre de places</label>
    <input type="number" id="places" name="places" required min="1" max="200" step="1">

    <button type="submit">Enregistrer</button>
</form>
